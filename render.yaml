services:
  - type: web
    name: deepfake-investigation-system
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python download_model.py && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HF_REPO_ID
        value: "jayanthrx/deepfake-efficientnet"
      - key: FLASK_ENV
        value: production

